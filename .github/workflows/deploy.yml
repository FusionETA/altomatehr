name: Deploy

# Ships main to production (hr.altomate.io) on the droplet.
#
# AUTOMATIC: runs when the CI workflow finishes successfully for a push to main —
# i.e. every merged PR, once its tests pass. It reuses that CI run instead of
# testing a second time, so a red CI never deploys.
#
# MANUAL: "Run workflow" in the Actions tab redeploys the current main. It still
# refuses unless CI passed on that exact commit.
#
# The actual deploy lives on the server in /usr/local/bin/altomatehr-v2-deploy.sh
# (pull, rebuild API container, rebuild frontend, health-check; log at
# /var/log/altomatehr-v2-deploy.log). The DEPLOY_SSH_KEY secret is pinned to that
# script in root's authorized_keys, so it can't run anything else on the box.
#
# Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a second merge waits for the first rather than cancelling it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    # workflow_run fires for PR runs too (head branch main); only deploy real pushes that passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hr.altomate.io
    steps:
      - name: Pick the commit to ship
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            SHA=$RUN_SHA
          else
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            OK=$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" --event push \
                   --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
            if [ "$OK" = "0" ]; then
              echo "::error::CI has not passed on main ($SHA) — not deploying."
              exit 1
            fi
          fi
          echo "Deploying $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server ignores the command and runs the deploy script; the SHA is
          # passed so it can confirm it's shipping the commit CI tested.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 \
            "root@$DEPLOY_HOST" "$SHA"
