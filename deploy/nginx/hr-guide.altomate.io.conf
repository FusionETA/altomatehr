# AltomateHR user guides.
#   /          landing page   -> user-guide/index.html
#   /admin     admin guide    -> user-guide/altomatehr-admin-guide.html
#   /employee  employee guide -> user-guide/altomatehr-employee-guide.html
# Everything is served straight from the deployed checkout, so every deploy of
# FusionETA/altomatehr main updates it. Screenshots load from /shots/... via the
# guides' relative src="shots/..." paths, which is why /admin and /employee have
# no trailing slash.
#
# Reference copy: deploy/nginx/hr-guide.altomate.io.conf in the repo. Installed at
# /etc/nginx/sites-available/hr-guide.altomate.io (certbot manages the TLS lines).
server {
    server_name hr-guide.altomate.io;

    root /opt/altomatehr-v2/user-guide;

    location ~ /\. { deny all; }

    location = / { try_files /index.html =404; }

    location = /admin    { default_type text/html; try_files /altomatehr-admin-guide.html =404; }
    location = /employee { default_type text/html; try_files /altomatehr-employee-guide.html =404; }

    # /admin/ and /employee/ would break the relative screenshot paths.
    location = /admin/    { return 301 /admin; }
    location = /employee/ { return 301 /employee; }

    location /shots/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Nothing else is published (e.g. the raw .html filenames).
    location / { return 404; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hr-guide.altomate.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hr-guide.altomate.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = hr-guide.altomate.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name hr-guide.altomate.io;
    return 404; # managed by Certbot


}